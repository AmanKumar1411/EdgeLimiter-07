name = "edge-limiter"
main = "src/index.ts"
compatibility_date = "2026-04-28"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[kv_namespaces]]
binding = "CONFIG_KV"
id = "6264fac76d8148638b973f56b5bc7b0d"

[[d1_databases]]
binding = "DB"
database_name = "edge-limiter-db"
database_id = "f5939813-c18d-4cb3-94a7-df5f3ac39b78"
migrations_dir = "migrations"

[[queues.producers]]
binding = "LOG_QUEUE"
queue = "rate-limit-logs"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[[queues.consumers]]
queue = "rate-limit-logs"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
# Optional: keep messages that exhaust retries instead of dropping them.
# Create the queue first: npx wrangler queues create rate-limit-logs-dlq
# dead_letter_queue = "rate-limit-logs-dlq"

[triggers]
crons = ["0 0 * * *"]

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "edge_limiter_analytics"

[ai]
binding = "AI"

# Defaults; override per environment or in .dev.vars for local dev.
[vars]
CORS_ORIGINS = "*"
RATE_LIMIT_FAIL_MODE = "open"
AI_TIMEOUT_MS = "8000"
# SECURITY_LOG_RETENTION_DAYS = "30"   # unset = keep security_logs forever
